<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeonu's Portfolio</title>
  <meta name="description" content="Yeonu's Portfolio">
  <meta name="author" content="Yeonu">
  <link rel="icon" type="image/png" href="image/favicon.png" />
  <script
    src="https://kit.fontawesome.com/3a958aff89.js"
    crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,700;1,400&display=swap"
  rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
</head>
<body>
  <!-- Navbar -->
  <nave id="navbar">
    <div class="navbar__logo">
      <i class="fab fa-diaspora"></i>
      <a href="#">Yeonu</a>
    </div>
    <div class="navbar__menu">
      <ul class="navbar__menu">
        <li class="navbar__menu__item">Home</li>
        <li class="navbar__menu__item">About</li>
        <li class="navbar__menu__item">Skills</li>
        <li class="navbar__menu__item">My work</li>
        <li class="navbar__menu__item">Testimonials</li>
        <li class="navbar__menu__item">Contact</li>
      </ul>
    </div>
  </nave>

  <!-- Home -->
  <section id="Home">
    <imag 
    src="image/cat.jpg"
    alt="Yeonu's profile photo"
    class="home__avatar"></imag>
    <h1 class="home__title">Hello, <br />I'm Yeonu.</h1>
    <h2 class="home__description">HelloHello</h2>
    <button class="home__contact">Contact Me</button>
  </section>

  <!-- About -->
  <section id="about">
    <h1>About me</h1>
    <p>Hi. I'm Yeonu</p>
    <div class="about__majors">
      <div class="major">
      <div class="major__icon"></div>
      <div class="major__title">Front-end</div>
      <div class="major__description">
        HTML, JavaScript, Css
      </div>
      </div>
    </div>
    <div class="about__jobs">
      <div class="job">
        <img
        class="job__logo">
          <p class="job__name">Suncheon National University</p>
          <p class="job__period">2018.03 ~ 2023.02</p>
        </img>
      </div>
    </div>
  </section>

  <!-- Skills -->
  <section id="skills"></section>
  <!-- Work -->
  <section id="work"></section>
  <!-- Testimonials -->
  <section id="testimonials"></section>
  <!-- Contact -->
  <section id="contact"></section>
</body>
</html>
